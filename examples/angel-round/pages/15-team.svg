<circle cx="728" cy="330" r="40" fill="#1A1A1A" data-name="Chase Chen avatar"/>
<text x="788" y="323.0" font-size="30" font-weight="600" fill="#1A1A1A" data-box="788 296 420 40" data-name="Chase Chen name" data-line-height="1.4">Chase Chen</text>
<text x="788" y="359.6" font-size="24" font-weight="400" fill="#666666" data-box="788 338 420 36" data-name="Chase Chen role" data-line-height="1.4">产品与工程</text>
<text x="688" y="420.7" font-size="23" fill="#1A1A1A" data-box="688 400 520 260" data-name="Chase Chen bio" data-line-height="1.45"><tspan x="688" dy="0">负责客户侧技术落地：Patsnap POC 的压力测试、RBAC 上线、Confluence 迁移与 Jira 联动；产品导览与用户手册。</tspan></text>
