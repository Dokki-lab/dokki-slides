<rect x="120" y="680" width="1680" height="2" fill="#D6D7D2" data-name="Rule"/>
<text x="120" y="731.2" font-size="28" font-weight="600" fill="#F50132" data-box="120 706 600 40" data-name="Why heading" data-line-height="1.4">为什么我们有能力赢</text>
<text x="120" y="781.6" font-size="24" fill="#1A1A1A" data-box="120 760 1680 210" data-name="Why" data-line-height="1.5"><tspan x="120" dy="0">·  交付速度：12 个月建成第 8 页的系统，近 90 天 7,639 次提交、2,804 个合并 PR——因为我们自己就是「人 + Agent 团队」的第一个客户。</tspan><tspan x="120" dy="36.0">·  洞察来自实践：五堵墙、三类引擎、上下文闭环都是在自己的研发和市场流程里撞出来的，不是从行业报告里抄的。</tspan><tspan x="120" dy="36.0">·  Agent 基础设施与实时协作两边的工程经验同时在一个团队里，这个组合很少见。</tspan></text>
<text x="120" y="1024" font-size="24" fill="#666666" data-box="120 992 1250 40" data-name="Footer">Dokki · 天使轮 · 2026-09 · 保密</text><text x="1800" y="1024" font-size="24" fill="#666666" text-anchor="end" data-box="1540 992 260 40" data-name="Page">15</text>
