name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # v2 has no dependencies: the skill runs on the vendored core bundle.
      - run: node --test
      - run: node dokki-slides/scripts/dokki-slides.mjs check examples/angel-round/deck.json
      - run: node dokki-slides/scripts/dokki-slides.mjs package examples/angel-round/deck.json --out-dir dist/angel-round
