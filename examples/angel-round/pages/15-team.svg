<text x="1356" y="359.6" font-size="24" font-weight="400" fill="#666666" data-box="1356 338 420 36" data-name="Lu Yang role" data-line-height="1.4">商务与销售</text>
<text x="1256" y="420.7" font-size="23" fill="#1A1A1A" data-box="1256 400 520 260" data-name="Lu Yang bio" data-line-height="1.45"><tspan x="1256" dy="0">负责企业客户访谈、销售 Deck 与一线销售场景设计（拜访后跟进闭环）。</tspan></text>
