<line x1="468" y1="428" x2="552" y2="428" stroke="#1A1A1A" stroke-width="3" data-arrow="end" data-name="Arrow 1"/>
<rect x="560" y="380" width="240" height="96" rx="48" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" data-name="Step 捕获"/>
