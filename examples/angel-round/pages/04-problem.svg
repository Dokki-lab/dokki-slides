<text x="190" y="507.4" font-size="26" font-weight="500" fill="#1A1A1A" text-anchor="middle" data-box="190 484 140 32" data-name="Browser" data-line-height="1.4">Browser</text>
</g>
<text x="120" y="925.2" font-size="28" font-weight="600" fill="#F50132" data-box="120 900 900 44" data-name="Caption" data-line-height="1.4">Context copied. Decisions lost. Work restarted.</text>
<rect x="1000" y="300" width="2" height="560" fill="#D6D7D2" data-name="Divider"/>
<text x="1040" y="323.4" font-size="26" fill="#1A1A1A" data-box="1040 300 760 540" data-name="Symptoms" data-line-height="1.5"><tspan x="1040" dy="0">·  工具能被调用，不等于一项工作有连续的状态：版本、权限、谁改了什么、下一步依赖什么，散在六个系统里。</tspan><tspan x="1040" dy="39.0">·  上下文在复制、转换和交接中丢失。最终的 PDF 记录了「是什么」，没有「为什么」「被否决了什么」「谁确认的」。</tspan><tspan x="1040" dy="39.0">·  多个 Agent 并发改同一份东西会互相覆盖；改完自己也看不到结果，越改越歪。</tspan><tspan x="1040" dy="39.0">·  于是我们不断写指令、建 MCP、写 Skills，让 Agent 去适应围绕人设计的软件。</tspan></text>
<text x="1040" y="905.2" font-size="28" font-weight="600" fill="#1A1A1A" data-box="1040 880 760 90" data-name="Question" data-line-height="1.35">为什么不直接给 Agent 建一套适合它工作的基础设施，再让人自然地参与进来？</text>
<text x="120" y="1024" font-size="24" fill="#666666" data-box="120 992 1250 40" data-name="Footer">Dokki · 天使轮 · 2026-09 · 保密</text><text x="1800" y="1024" font-size="24" fill="#666666" text-anchor="end" data-box="1540 992 260 40" data-name="Page">04</text>
</svg>
