<text x="220" y="359.6" font-size="24" font-weight="400" fill="#666666" data-box="220 338 420 36" data-name="Brad Bao role" data-line-height="1.4">创始人 &amp; CEO</text>
<text x="120" y="420.7" font-size="23" fill="#1A1A1A" data-box="120 400 520 260" data-name="Brad Bao bio" data-line-height="1.45"><tspan x="120" dy="0">清华大学。前 Cobo（数字资产基础设施）：生成式 AI、自动驾驶与区块链方向的研发与工程。常驻新加坡。</tspan><tspan x="120" dy="33.35">一个人带着一支 Agent 团队把 Dokki 做到今天的状态；产品、架构与研发流程的设计者。</tspan></text>
</g>
