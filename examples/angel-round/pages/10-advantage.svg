<text x="120" y="100" font-size="28" font-weight="600" fill="#F50132" data-box="120 68 1100 44" data-name="Kicker" letter-spacing="2">LONG-TERM ADVANTAGE</text>
<text x="120" y="207.6" font-size="64" font-weight="500" fill="#1A1A1A" data-box="120 150 1680 73" data-name="Title" letter-spacing="-1">Work creates context. Context improves work.</text>
<g data-group data-name="Loop">
<rect x="220" y="380" width="240" height="96" rx="48" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" data-name="Step 工作"/>
